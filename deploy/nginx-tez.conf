# Admin panel va Click callback (HTTPS certbot bilan). DNS: <DOMEN> → 95.111.234.221
# O'rnatish: cp deploy/nginx-tez.conf /etc/nginx/sites-available/teztopshir && ln -s ... sites-enabled/ &&
#            certbot --nginx -d <DOMEN> && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name <DOMEN>;

    # Click Prepare/Complete — ommaviy (imzo bot ichida tekshiriladi)
    location /click/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin panel — Telegram orqali tasdiqlangan sessiya; Real-IP faqat loopback'dan ishoniladi
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }
}
